<bc-dialog>
  <div header class="header">
    <h2 class="mb-0">{{ header | translate }}</h2>
    @if (showDiscard) {
      <bc-icon-button variant="tertiary" icon="cancel" (buttonClick)="discard.emit()" [ariaLabel]="'APP.CLOSE' | translate"></bc-icon-button>
    }
  </div>
  <ng-content></ng-content>
  <div buttons class="flex gap-2">
    @if (showDiscard) {
      <bc-button color="default" [label]="discardText | translate" variant="tertiary" (buttonClick)="discard.emit()"></bc-button>
    }

    <ng-content select="[actions]"></ng-content>
    @if (showOk) {
      <bc-button [loading]="saving" [color]="okColor" [label]="okText | translate" variant="primary" (buttonClick)="ok.emit()" [disabled]="!canOk"></bc-button>
    }
  </div>
</bc-dialog>
