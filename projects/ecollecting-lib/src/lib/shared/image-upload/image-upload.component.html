<vo-ecol-file-input
  [label]="label"
  [dragDropEnabled]="true"
  [fileDisplayType]="'preview'"
  [layout]="'area'"
  [accept]="acceptedFileTypes"
  [hint]="hint"
  [files]="image ? [image] : []"
  (filesChanged)="imageChanged.emit($event[0])"
  (fileDeleted)="imageDeleted.emit()"
  [fileLoading]="fileLoading"
  [readonly]="readonly"
  [maxFileSize]="maxSizeInBytes"
  [multiple]="false"
  [required]="required"
></vo-ecol-file-input>
